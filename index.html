<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f6f2f1">
<title>Valeryiankaa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f6f2f1; --card:#ffffff; --fg:#2a2022; --muted:#7d6f72; --line:#e8dfde;
  --accent:#6b1f30; --accent-fg:#ffffff; --accent-soft:#f1e1e5; --ok:#2f7d59; --ok-soft:#dff0e8; --water:#4a7fa8;
  --display:'Unbounded','Onest',sans-serif; --body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --top:max(10px,env(safe-area-inset-top,0px)); --bot:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#1a1214; --card:#251a1d; --fg:#f3e9ea; --muted:#a8979b; --line:#3a2b2f;
  --accent:#d4607a; --accent-fg:#1a1214; --accent-soft:#3a2229; --ok:#6fcf9f; --ok-soft:#1f3329; --water:#7fb1d8; color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1214; --card:#251a1d; --fg:#f3e9ea; --muted:#a8979b; --line:#3a2b2f;
  --accent:#d4607a; --accent-fg:#1a1214; --accent-soft:#3a2229; --ok:#6fcf9f; --ok-soft:#1f3329; --water:#7fb1d8; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 var(--body)}
body{padding:var(--top) max(16px,env(safe-area-inset-left,0px)) calc(92px + var(--bot)) max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
#view{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h1{font:600 24px/1.2 var(--body);margin:0;text-wrap:balance}
h2{font:600 20px/1.25 var(--body);margin:0;text-wrap:balance}
.eyebrow{font-size:13px;color:var(--muted);letter-spacing:.02em}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.hero{background:var(--accent-soft);border-color:transparent}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--muted);font-size:14px}
.btn{border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer;font-weight:500;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600;font-size:16px;width:100%;min-height:52px;border-radius:14px}
.btn.ghost{border-color:transparent;color:var(--accent);padding-inline:6px}
.btn:disabled{opacity:.45}
.btn:focus-visible,.tab:focus-visible,.chk:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s}
.drops{display:flex;gap:6px;flex-wrap:wrap}
.drops i{width:22px;height:22px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;border:2px solid var(--line)}
.drops i.on{background:var(--water);border-color:var(--water)}
.num{font:500 22px var(--display);letter-spacing:-.02em}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:8px;padding:3px 8px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.chip.soft{background:var(--accent-soft);color:var(--accent)}
.skel{background:linear-gradient(90deg,var(--line),transparent,var(--line));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:14px;height:96px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
/* нижняя панель */
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + var(--bot));z-index:5}
#tabs .in{display:flex;width:100%;max-width:480px}
.tab{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;min-height:52px;color:var(--muted);font-size:11.5px;cursor:pointer;border-radius:12px}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent);font-weight:600}
/* список «Ещё» */
.list{padding:4px 16px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:14px 0;text-align:left;cursor:pointer;min-height:52px}
.item:first-child{border-top:0}
.item small{display:block;color:var(--muted);font-size:13px}
.item svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
/* тренировка */
.steps{display:flex;gap:5px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}.steps i.done{background:var(--accent)}.steps i.cur{background:var(--accent);opacity:.45}
.setrow{display:grid;grid-template-columns:24px 1fr 48px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow .n{font:500 13px var(--display);color:var(--muted);text-align:center}
.stepper{display:flex;align-items:center;gap:6px;min-width:0}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;font-size:20px;cursor:pointer;flex:none}
.stepper .v{flex:1;min-width:0;text-align:center}
.stepper input{width:100%;text-align:center;font:600 20px var(--body);border:0;background:transparent;color:var(--fg);padding:2px 0;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper small{display:block;text-align:center;color:var(--muted);font-size:12px;margin-top:-2px}
.chk{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:transparent;color:transparent;font-size:22px;cursor:pointer;display:grid;place-items:center;padding:0}
.setrow.done .chk{background:var(--ok);border-color:var(--ok);color:var(--accent-fg)}
.setrow.done .stepper{opacity:.55}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.last{display:inline-flex;align-self:flex-start;background:var(--accent-soft);color:var(--accent);padding:6px 12px;border-radius:10px;font-size:14px;font-weight:500}
.desc{margin:0;color:var(--muted);font-size:14px}
#rest{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + var(--bot));box-shadow:0 -10px 30px rgba(0,0,0,.14);transform:translateY(115%);transition:transform .25s ease;z-index:9}
#rest.on{transform:none}
#rest .in{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:16px}
.ring{position:relative;width:80px;height:80px;flex:none}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:500 17px var(--display)}
.rtxt{flex:1;min-width:0}.rtxt strong{display:block}.rtxt span{color:var(--muted);font-size:14px}
.rbtn{display:flex;flex-direction:column;gap:6px}.rbtn .btn{min-height:40px;padding:8px 12px}
.chart{width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font:11px var(--body)}
.chart .val{fill:var(--fg);font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(88px + var(--bot));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
.center{text-align:center;padding:48px 8px;display:flex;flex-direction:column;gap:12px;align-items:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="view"></div>
<nav id="tabs" aria-label="Разделы"><div class="in">
  <button class="tab" data-t="today"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Сегодня</button>
  <button class="tab" data-t="train"><svg viewBox="0 0 24 24"><path d="M6 8v8M3 10v4M18 8v8M21 10v4M6 12h12"/></svg>Тренировка</button>
  <button class="tab" data-t="records"><svg viewBox="0 0 24 24"><path d="M4 19V10M10 19V5M16 19v-7M21 19H3"/></svg>Рекорды</button>
  <button class="tab" data-t="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>Ещё</button>
</div></nav>
<div id="rest" role="timer"><div class="in">
  <div class="ring"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="arc" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="0"/></svg><b id="clock">1:30</b></div>
  <div class="rtxt"><strong>Отдых</strong><span id="rhint">Следующий подход скоро</span></div>
  <div class="rbtn"><button class="btn" id="rplus">+30 сек</button><button class="btn" id="rskip">Пропустить</button></div>
</div></div>
<div id="toast"></div>

<script>
"use strict";
var API_URL = "https://script.google.com/macros/s/AKfycbxSoib5pH11sG9oabyGSGGCQ5V-6nlZFQU4s85AHZrb96v_5fcOqvhi0Fb5d6VKlqKnHQ/exec";
var tg = window.Telegram && window.Telegram.WebApp;
var DEMO = /[?&]demo=1/.test(location.search);
var REST_DEFAULT = 90;
var view = document.getElementById("view");
var S = { tab: "today", home: null, workouts: null, records: null, run: null };

/* ---------- Телеграм ---------- */
function setupTelegram() {
  if (!tg) return;
  try {
    tg.ready(); tg.expand();
    if (tg.colorScheme) document.documentElement.setAttribute("data-theme", tg.colorScheme);
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    var bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    if (tg.setHeaderColor) tg.setHeaderColor(bg);
    if (tg.setBackgroundColor) tg.setBackgroundColor(bg);
    tg.onEvent("themeChanged", function () { document.documentElement.setAttribute("data-theme", tg.colorScheme); });
  } catch (e) {}
}
function haptic(kind) { try { if (tg && tg.HapticFeedback) { kind === "ok" ? tg.HapticFeedback.notificationOccurred("success") : tg.HapticFeedback.impactOccurred("light"); } } catch (e) {} }
function toast(t) { var el = document.getElementById("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove("on"); }, 2400); }

/* ---------- обмен данными ---------- */
function api(req) {
  if (DEMO) return demoApi(req);
  req.initData = tg ? tg.initData : "";
  var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 25000) : null;
  return fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(req), signal: ctrl ? ctrl.signal : undefined })
    .then(function (r) { return r.json(); })
    .then(function (j) { clearTimeout(timer); return j; })
    .catch(function () { clearTimeout(timer); return { ok: false, error: "net" }; });
}
function esc(t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function fmt(n) { return String(n).replace(".", ","); }
function num(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
function plural(n, a, b, c) { var m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : (m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c); }
function skeleton() { view.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>'; }
function errorScreen(code, retry, why) {
  var msg = code === "auth" ? "Не получилось проверить вход. Закрой приложение и открой его снова из бота." :
    code === "noaccess" ? "Этот раздел доступен по подписке." : "Нет связи с ботом. Проверь интернет и попробуй ещё раз.";
  view.innerHTML = '<div class="center"><h2>Что-то пошло не так</h2><div class="muted">' + msg + '</div>' + (why ? '<div class="muted" style="font-size:12px">код: ' + esc(why) + '</div>' : '') + '<button class="btn primary" style="max-width:260px" id="retry">Повторить</button></div>';
  document.getElementById("retry").onclick = retry;
}
function goBot(cmd) { api({ api: "cmd", cmd: cmd }).then(function (r) { if (r && r.ok) { try { tg && tg.close(); } catch (e) {} } else toast("Не получилось, попробуй ещё раз"); }); toast("Открываю в чате…"); }

/* ---------- навигация ---------- */
function setTab(t) {
  S.tab = t;
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) { b.classList.toggle("on", b.dataset.t === t); b.setAttribute("aria-current", b.dataset.t === t ? "page" : "false"); });
  window.scrollTo(0, 0);
  if (t === "today") showToday(); else if (t === "train") showTrain(); else if (t === "records") showRecords(); else showMore();
}
document.getElementById("tabs").addEventListener("click", function (e) { var b = e.target.closest(".tab"); if (b) { if (S.run) { leaveRun(true); } setTab(b.dataset.t); } });

/* ---------- Сегодня ---------- */
function showToday(force) {
  if (S.home && !force) return renderToday();
  skeleton();
  api({ api: "home" }).then(function (r) {
    if (!r || !r.ok) return errorScreen(r && r.error, function () { showToday(true); }, r && r.why);
    S.home = r; if (S.tab === "today") renderToday();
  });
}
function renderToday() {
  var h = S.home, o = '<div><div class="eyebrow">' + esc(h.weekday) + ', ' + esc(h.date) + '</div><h1>Привет' + (h.name ? ', ' + esc(h.name) : '') + '</h1></div>';
  if (!h.access) {
    o += '<div class="card hero"><h2>Приложение доступно по подписке</h2><div class="muted">Тренировки, питание, рекорды и таймер отдыха откроются после оплаты.</div>' +
      '<button class="btn primary" data-cmd="/subscribe">Оформить доступ</button></div>';
    view.innerHTML = o; return;
  }
  if (h.workout) {
    var w = h.workout;
    o += '<div class="card hero"><div class="label">Следующая тренировка</div><h2>' + esc(w.name) + '</h2><div class="muted">' + w.exercises + ' ' + plural(w.exercises, "упражнение", "упражнения", "упражнений") +
      (w.lastDaysAgo != null ? ' · прошлая ' + (w.lastDaysAgo <= 0 ? 'сегодня' : w.lastDaysAgo === 1 ? 'вчера' : w.lastDaysAgo + ' ' + plural(w.lastDaysAgo, "день", "дня", "дней") + ' назад') : '') +
      '</div><button class="btn primary" data-start="' + esc(w.id) + '">Начать</button></div>';
  } else {
    o += '<div class="card"><div class="label">Тренировка</div><div class="muted">Тренер ещё не назначил тебе тренировку.</div></div>';
  }
  var n = h.nutrition, pct = n.goal ? Math.min(100, Math.round(n.kcal / n.goal * 100)) : 0;
  o += '<div class="card"><div class="label">Питание</div>';
  if (n.goal) {
    var left = n.goal - n.kcal;
    o += '<div class="row"><div class="num">' + num(n.kcal) + '<span class="muted" style="font:14px var(--body)"> из ' + num(n.goal) + ' ккал</span></div></div><div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="muted">' + (n.entries === 0 ? 'Пока ничего не записано' : left >= 0 ? 'Осталось ' + num(left) + ' ккал' + (n.proteinGoal && n.proteinGoal - n.protein > 0 ? ' · белка ' + (n.proteinGoal - n.protein) + ' г' : '') : 'Норма выполнена, сверху ' + num(-left) + ' ккал') + '</div>';
  } else {
    o += '<div class="muted">' + (n.entries ? 'Записано ' + num(n.kcal) + ' ккал' : 'Пока ничего не записано') + '. Норму можно задать в боте.</div>';
  }
  o += '<div class="tools"><button class="btn" data-cmd="/food">Записать еду</button><button class="btn" data-cmd="/foodphoto">Распознать по фото</button></div></div>';
  var d = '', i; for (i = 0; i < h.water.goal; i++) d += '<i class="' + (i < h.water.now ? 'on' : '') + '"></i>';
  o += '<div class="card"><div class="row"><div class="label">Вода</div><div class="muted">' + h.water.now + ' из ' + h.water.goal + '</div></div><div class="drops">' + d + '</div>' +
    (h.water.now < h.water.goal ? '<button class="btn" id="water" style="align-self:flex-start">+ стакан</button>' : '<div class="muted">Норма воды выполнена</div>') + '</div>';
  if (h.booking) {
    o += '<div class="card"><div class="label">Ближайшее занятие</div><div class="row"><h2>' + esc(h.booking.day) + ', ' + esc(h.booking.time) + '</h2></div><div class="muted">' + esc(h.booking.format) + (h.booking.pending ? ' · ждёт подтверждения' : '') + '</div></div>';
  }
  if (h.sub) {
    o += '<div class="card"><div class="row"><div><div class="label">Подписка</div><div>до ' + esc(h.sub.until) + '</div></div>' +
      (h.sub.daysLeft <= 7 ? '<button class="btn" data-cmd="/subscribe">Продлить</button>' : '') + '</div>' +
      (h.sub.daysLeft <= 7 ? '<div class="muted">' + (h.sub.daysLeft <= 0 ? 'Заканчивается сегодня' : 'Осталось ' + h.sub.daysLeft + ' ' + plural(h.sub.daysLeft, "день", "дня", "дней")) + '</div>' : '') + '</div>';
  }
  view.innerHTML = o;
  var wb = document.getElementById("water");
  if (wb) wb.onclick = function () { wb.disabled = true; haptic(); api({ api: "water" }).then(function (r) { if (r && r.ok) { S.home.water = r.water; renderToday(); } else { wb.disabled = false; toast("Не получилось"); } }); };
}
view.addEventListener("click", function (e) {
  var c = e.target.closest("[data-cmd]"); if (c) return goBot(c.dataset.cmd);
  var s = e.target.closest("[data-start]"); if (s) return openRun(s.dataset.start);
});

/* ---------- Тренировки ---------- */
function showTrain() {
  skeleton();
  api({ api: "workouts" }).then(function (r) {
    if (S.tab !== "train") return;
    if (!r || !r.ok) return errorScreen(r && r.error, showTrain);
    S.workouts = r.workouts;
    var o = '<h1>Тренировки</h1>';
    if (!r.workouts.length) o += '<div class="card"><div class="muted">Тренер ещё не назначил тебе тренировку.</div></div>';
    r.workouts.forEach(function (w) {
      o += '<button class="card" style="text-align:left;cursor:pointer" data-start="' + esc(w.id) + '"><div class="row"><h2>' + esc(w.name) + '</h2>' + (w.next ? '<span class="chip soft">следующая</span>' : '') + '</div><div class="muted">' + w.exercises + ' ' + plural(w.exercises, "упражнение", "упражнения", "упражнений") + '</div></button>';
    });
    view.innerHTML = o;
  });
}

function openRun(id) {
  skeleton();
  api({ api: "workout", id: id }).then(function (r) {
    if (!r || !r.ok) return errorScreen(r && r.error === "notfound" ? "net" : r && r.error, function () { openRun(id); });
    var saved = null; try { saved = JSON.parse(localStorage.getItem("wk_" + id) || "null"); } catch (e) {}
    var fresh = !saved || Date.now() - saved.t > 12 * 3600 * 1000 || saved.n !== r.exercises.length;
    var run = fresh ? { id: id, name: r.name, ex: r.exercises, i: 0, session: "s" + Date.now(), sets: r.exercises.map(function (e) { var a = []; for (var k = 0; k < e.sets; k++) a.push({ w: e.last || 0, done: false }); return a; }), t: Date.now(), n: r.exercises.length }
      : { id: id, name: r.name, ex: r.exercises, i: saved.i, session: saved.session, sets: saved.sets, t: saved.t, n: saved.n };
    S.run = run; S.tab = "run"; renderRun();
  });
}
function persistRun() { try { var r = S.run; localStorage.setItem("wk_" + r.id, JSON.stringify({ i: r.i, session: r.session, sets: r.sets, t: Date.now(), n: r.n })); } catch (e) {} }
function leaveRun(silent) { stopRest(); if (S.run) persistRun(); S.run = null; }
function bestWeight(sets) { var b = null; sets.forEach(function (s) { if (s.done && s.w > 0 && (b === null || s.w > b)) b = s.w; }); return b; }
function saveRun(finished) {
  var r = S.run; return api({ api: "save", workoutId: r.id, sessionId: r.session, weights: r.sets.map(bestWeight), finished: finished });
}
function renderRun() {
  var r = S.run, e = r.ex[r.i], sets = r.sets[r.i], done = sets.filter(function (s) { return s.done; }).length;
  var lastEx = r.i === r.ex.length - 1;
  var o = '<div class="row"><button class="btn ghost" id="back">← К списку</button><span class="muted">' + (r.i + 1) + ' из ' + r.ex.length + '</span></div><div class="steps">';
  r.ex.forEach(function (_, k) { o += '<i class="' + (k < r.i ? 'done' : k === r.i ? 'cur' : '') + '"></i>'; });
  o += '</div><section class="card"><h2>' + esc(e.name) + '</h2><div class="muted">' + e.sets + ' × ' + esc(e.reps) + '</div>';
  if (e.last) o += '<div class="last">Прошлый раз: ' + fmt(e.last) + ' кг</div>';
  if (e.video || e.desc) {
    o += '<div class="tools">' + (e.video ? '<button class="btn" id="vid">Видео в чат</button>' : '') + (e.desc ? '<button class="btn" id="tech">Описание</button>' : '') + '</div>' + (e.desc ? '<p class="desc" id="desc"' + (r.showDesc ? '' : ' hidden') + '>' + esc(e.desc) + '</p>' : '');
  }
  o += '</section><section class="card" style="gap:0">';
  sets.forEach(function (s, k) {
    o += '<div class="setrow' + (s.done ? ' done' : '') + '"><div class="n">' + (k + 1) + '</div><div class="stepper"><button data-a="dec" data-k="' + k + '" aria-label="Минус 2,5 кг">−</button><div class="v"><input id="w' + k + '" data-k="' + k + '" inputmode="decimal" value="' + fmt(s.w) + '" aria-label="Вес подхода ' + (k + 1) + '"><small>кг</small></div><button data-a="inc" data-k="' + k + '" aria-label="Плюс 2,5 кг">+</button></div><button class="chk" data-a="done" data-k="' + k + '" aria-label="Подход выполнен">✓</button></div>';
  });
  o += '</section><button class="btn primary" id="next">' + (lastEx ? 'Завершить тренировку' : 'Дальше') + '</button>';
  if (r.i > 0) o += '<button class="btn ghost" id="prev" style="align-self:center">← Предыдущее упражнение</button>';
  view.innerHTML = o; setTabsActive();
  document.getElementById("back").onclick = function () { leaveRun(); setTab("train"); };
  var t = document.getElementById("tech"); if (t) t.onclick = function () { var d = document.getElementById("desc"); d.hidden = !d.hidden; r.showDesc = !d.hidden; };
  var v = document.getElementById("vid"); if (v) v.onclick = function () { v.disabled = true; persistRun(); toast("Присылаю видео в чат…"); api({ api: "video", number: e.number, workoutId: r.id }).then(function (x) { if (x && x.ok) { try { tg && tg.close(); } catch (er) {} } else { v.disabled = false; toast("Не получилось"); } }); };
  document.getElementById("next").onclick = nextEx;
  var p = document.getElementById("prev"); if (p) p.onclick = function () { stopRest(); S.run.i--; S.run.showDesc = false; persistRun(); renderRun(); window.scrollTo(0, 0); };
}
function setTabsActive() { Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (b) { b.classList.toggle("on", b.dataset.t === "train"); }); }
view.addEventListener("click", function (ev) {
  if (!S.run) return;
  var b = ev.target.closest("button[data-a]"); if (!b) return;
  var k = +b.dataset.k, s = S.run.sets[S.run.i][k], a = b.dataset.a;
  if (a === "inc") { s.w = Math.round((s.w + 2.5) * 10) / 10; document.getElementById("w" + k).value = fmt(s.w); persistRun(); haptic(); }
  if (a === "dec") { s.w = Math.max(0, Math.round((s.w - 2.5) * 10) / 10); document.getElementById("w" + k).value = fmt(s.w); persistRun(); haptic(); }
  if (a === "done") {
    s.done = !s.done; haptic(); persistRun(); renderRun();
    if (s.done && S.run.sets[S.run.i].some(function (x) { return !x.done; })) startRest(REST_DEFAULT); else stopRest();
  }
});
view.addEventListener("change", function (ev) {
  if (!S.run || ev.target.tagName !== "INPUT") return;
  var v = parseFloat(String(ev.target.value).replace(",", ".")); S.run.sets[S.run.i][+ev.target.dataset.k].w = isNaN(v) || v < 0 ? 0 : v; persistRun();
});
function nextEx() {
  var r = S.run; stopRest();
  if (r.i < r.ex.length - 1) { saveRun(false); r.i++; r.showDesc = false; persistRun(); renderRun(); window.scrollTo(0, 0); return; }
  var btn = document.getElementById("next"); btn.disabled = true; btn.textContent = "Сохраняю…";
  saveRun(true).then(function (x) {
    if (!x || !x.ok) { btn.disabled = false; btn.textContent = "Завершить тренировку"; return toast("Не получилось сохранить, попробуй ещё раз"); }
    try { localStorage.removeItem("wk_" + r.id); } catch (e) {}
    haptic("ok"); renderSummary(r, x.records || []);
  });
}
function renderSummary(r, recs) {
  var recMap = {}; recs.forEach(function (x) { recMap[x.name] = x; });
  var o = '<div><div class="label">Готово</div><h1>Тренировка завершена</h1><div class="muted">' + esc(r.name) + '</div></div><section class="card" style="gap:0">';
  r.ex.forEach(function (e, k) {
    var b = bestWeight(r.sets[k]), rec = recMap[e.name];
    o += '<div class="row" style="padding:10px 0;border-top:' + (k ? '1px solid var(--line)' : '0') + '"><div><div>' + esc(e.name) + '</div><div class="muted">' + (b ? fmt(b) + ' кг' : 'без веса') + '</div></div>' + (rec ? '<span class="chip">рекорд +' + fmt(Math.round((rec.weight - rec.prev) * 10) / 10) + '</span>' : '') + '</div>';
  });
  o += '</section><button class="btn primary" id="fin">Готово</button>';
  view.innerHTML = o; S.run = null; S.records = null; S.home = null;
  document.getElementById("fin").onclick = function () { setTab("today"); };
}

/* ---------- таймер отдыха ---------- */
var rest = { end: 0, total: 0, id: null };
function startRest(sec) { stopRest(); rest.total = sec; rest.end = Date.now() + sec * 1000; document.getElementById("rest").classList.add("on"); tickRest(); rest.id = setInterval(tickRest, 500); }
function tickRest() {
  var left = Math.max(0, Math.ceil((rest.end - Date.now()) / 1000));
  document.getElementById("clock").textContent = Math.floor(left / 60) + ":" + (left % 60 < 10 ? "0" : "") + (left % 60);
  document.getElementById("arc").style.strokeDashoffset = 276.46 * (1 - left / rest.total);
  document.getElementById("rhint").textContent = left <= 10 && left > 0 ? "Готовься к подходу" : left === 0 ? "Время вышло, начинай подход" : "Следующий подход скоро";
  if (left === 0) { clearInterval(rest.id); rest.id = null; haptic("ok"); try { navigator.vibrate && navigator.vibrate(200); } catch (e) {} setTimeout(function () { if (!rest.id) document.getElementById("rest").classList.remove("on"); }, 2500); }
}
function stopRest() { if (rest.id) clearInterval(rest.id); rest.id = null; document.getElementById("rest").classList.remove("on"); }
document.getElementById("rplus").onclick = function () { rest.end += 30000; rest.total += 30; tickRest(); };
document.getElementById("rskip").onclick = stopRest;

/* ---------- Рекорды ---------- */
function chartSvg(points, w, h) {
  var ws = points.map(function (p) { return p.w; }), mn = Math.min.apply(null, ws), mx = Math.max.apply(null, ws), pad = 22;
  var rng = mx - mn || 1, W = w, H = h;
  var X = function (i) { return pad + (points.length === 1 ? (W - 2 * pad) / 2 : i * (W - 2 * pad) / (points.length - 1)); };
  var Y = function (v) { return H - pad - 10 - (v - mn) / rng * (H - 2 * pad - 20); };
  var d = points.map(function (p, i) { return (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.w).toFixed(1); }).join(" ");
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="График веса"><path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  points.forEach(function (p, i) { s += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p.w).toFixed(1) + '" r="4" fill="var(--accent)"/><text class="val" x="' + X(i).toFixed(1) + '" y="' + (Y(p.w) - 9).toFixed(1) + '" text-anchor="middle">' + fmt(p.w) + '</text><text x="' + X(i).toFixed(1) + '" y="' + (H - 4) + '" text-anchor="middle">' + esc(p.d) + '</text>'; });
  return s + '</svg>';
}
function showRecords() {
  var draw = function () {
    var items = S.records, o = '<h1>Рекорды</h1>';
    if (!items.length) o += '<div class="card"><div class="muted">Пока нет данных. После тренировок с рабочими весами здесь появятся твои рекорды и графики роста.</div></div>';
    items.forEach(function (e, i) {
      var gain = e.best - e.first;
      o += '<div class="card"><button class="row" style="background:none;border:0;padding:0;text-align:left;cursor:pointer;width:100%" data-rec="' + i + '"><div><div>' + esc(e.name) + '</div><div class="muted">' + e.n + ' ' + plural(e.n, "тренировка", "тренировки", "тренировок") + '</div></div><div style="text-align:right"><div class="num">' + fmt(e.best) + '<span class="muted" style="font:14px var(--body)"> кг</span></div>' + (gain > 0 ? '<span class="chip">+' + fmt(Math.round(gain * 10) / 10) + ' с начала</span>' : '') + '</div></button><div id="rc' + i + '" hidden>' + (e.points.length > 1 ? chartSvg(e.points, 320, 170) : '<div class="muted">Для графика нужно хотя бы две тренировки.</div>') + '</div></div>';
    });
    if (S.tab === "records") view.innerHTML = o;
  };
  if (S.records) return draw();
  skeleton();
  api({ api: "records" }).then(function (r) { if (S.tab !== "records") return; if (!r || !r.ok) return errorScreen(r && r.error, showRecords); S.records = r.items; draw(); });
}
view.addEventListener("click", function (e) { var b = e.target.closest("[data-rec]"); if (b) { var c = document.getElementById("rc" + b.dataset.rec); c.hidden = !c.hidden; } });

/* ---------- Ещё ---------- */

  ["Питание", [["Записать еду", "Из меню, текстом или вручную", "/food"], ["Распознать по фото", "ИИ посчитает калории", "/foodphoto"], ["Моя норма калорий", "", "/caloriegoal"], ["Мои частые продукты", "", "/favorites"]]],

  ["Запись и связь", [["Записаться на тренировку", "", "/schedule"], ["Мои записи", "", "/mybookings"], ["Задать вопрос тренеру", "", "/question"], ["Отзывы", "", "/reviews"]]],

    o += '</div></div>';
  });
  o += '<div class="muted" style="text-align:center">Эти разделы откроются в чате с ботом</div>';

}

setupTelegram();
if (!DEMO && !(tg && tg.initData)) {
  document.getElementById("tabs").style.display = "none";
  view.innerHTML = '<div class="center"><h2>Valeryiankaa</h2><div class="muted">Это приложение открывается из Телеграма: зайди в чат с ботом и нажми кнопку «Приложение».</div></div>';
