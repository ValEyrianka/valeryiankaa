<style>
:root{

}
:root[data-theme="dark"]{

  --bg:#1a1214; --card:#251a1d; --fg:#f3e9ea; --muted:#a8979b; --line:#3a2b2f;
  --accent:#d4607a; --accent-fg:#1a1214; --accent-soft:#3a2229; --ok:#6fcf9f; --ok-soft:#1f3329; --water:#7fb1d8; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 var(--body)}
body{padding:var(--top) max(16px,env(safe-area-inset-left,0px)) calc(92px + var(--bot)) max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;touch-action:manipulation}
button:active:not(:disabled),.tab:active,[data-go]:active,[data-card]:active,.fchip:active{transform:scale(.97);opacity:.8}
button:disabled{opacity:.6}
#nbar{position:fixed;left:0;top:0;height:3px;width:100%;z-index:60;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:40% 100%;background-repeat:no-repeat;opacity:0;pointer-events:none;transition:opacity .15s}

#view{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px;animation:fade .2s ease}

h1{font:600 24px/1.2 var(--body);margin:0;text-wrap:balance}
h2{font:600 20px/1.25 var(--body);margin:0;text-wrap:balance}
.eyebrow{font-size:13px;color:var(--muted);letter-spacing:.02em}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.hero{background:var(--accent-soft);border-color:transparent}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--muted);font-size:14px}
.btn{border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer;font-weight:500;font-size:15px}
.btn.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600;font-size:16px;width:100%;min-height:52px;border-radius:14px}
.btn.ghost{border-color:transparent;color:var(--accent);padding-inline:6px}
.btn:disabled{opacity:.45}
.btn:focus-visible,.tab:focus-visible,.chk:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s}
.drops{display:flex;gap:6px;flex-wrap:wrap}
.drops i{width:22px;height:22px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;border:2px solid var(--line)}
.drops i.on{background:var(--water);border-color:var(--water)}
.num{font:500 22px var(--display);letter-spacing:-.02em}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:8px;padding:3px 8px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.chip.soft{background:var(--accent-soft);color:var(--accent)}
.skel{background:linear-gradient(90deg,var(--line),transparent,var(--line));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:14px;height:96px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
/* нижняя панель */
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + var(--bot));z-index:5}
#tabs .in{display:flex;width:100%;max-width:480px}
.tab{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;min-height:52px;color:var(--muted);font-size:11.5px;cursor:pointer;border-radius:12px}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent);font-weight:600}
/* список «Ещё» */
.list{padding:4px 16px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:14px 0;text-align:left;cursor:pointer;min-height:52px}
.item:first-child{border-top:0}
.item small{display:block;color:var(--muted);font-size:13px}
.item svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
/* тренировка */
.steps{display:flex;gap:5px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}.steps i.done{background:var(--accent)}.steps i.cur{background:var(--accent);opacity:.45}
.setrow{display:grid;grid-template-columns:24px 1fr 48px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow .n{font:500 13px var(--display);color:var(--muted);text-align:center}
.tour{position:fixed;inset:0;background:rgba(30,12,18,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
.tourbox{background:var(--card);border-radius:24px;padding:26px 22px 18px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center;align-items:stretch}
.tourbox .bigemoji{font-size:44px}.dots{display:flex;gap:6px;justify-content:center}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent)}
.stepch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:2px 0 12px}.stepch .fchip{padding:6px 12px;min-height:34px}
.stepper{display:flex;align-items:center;gap:6px;min-width:0}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;font-size:20px;cursor:pointer;flex:none}
.stepper .v{flex:1;min-width:0;text-align:center}
.stepper input{width:100%;text-align:center;font:600 20px var(--body);border:0;background:transparent;color:var(--fg);padding:2px 0;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper small{display:block;text-align:center;color:var(--muted);font-size:12px;margin-top:-2px}
.chk{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:transparent;color:transparent;font-size:22px;cursor:pointer;display:grid;place-items:center;padding:0}
.setrow.done .chk{background:var(--ok);border-color:var(--ok);color:var(--accent-fg)}
.setrow.done .stepper{opacity:.55}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.last{display:inline-flex;align-self:flex-start;background:var(--accent-soft);color:var(--accent);padding:6px 12px;border-radius:10px;font-size:14px;font-weight:500}
.desc{margin:0;color:var(--muted);font-size:14px}
#rest{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + var(--bot));box-shadow:0 -10px 30px rgba(0,0,0,.14);transform:translateY(115%);transition:transform .25s ease;z-index:9}
#rest.on{transform:none}
#rest .in{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:16px}
.ring{position:relative;width:80px;height:80px;flex:none}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .9s linear}

.rtxt{flex:1;min-width:0}.rtxt strong{display:block}.rtxt span{color:var(--muted);font-size:14px}
.rbtn{display:flex;flex-direction:column;gap:6px}.rbtn .btn{min-height:40px;padding:8px 12px}
.chart{width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font:11px var(--body)}
.chart .val{fill:var(--fg);font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(88px + var(--bot));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
.center{text-align:center;padding:48px 8px;display:flex;flex-direction:column;gap:12px;align-items:center}
.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:12px 14px;font:16px var(--body);min-height:46px}
textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:10px 12px;font:15px/1.4 var(--body);resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap}

.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}

.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:1px}
.tbl{overflow-x:auto}.tbl table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}

.sheet-in{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:22px 22px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + var(--bot))}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ava{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid var(--accent-soft);flex:none}

.drops i{transition:background .35s,transform .35s}.drops i.on{transform:scale(1.08)}
.bar.thin{height:5px}.macros{display:flex;flex-direction:column;gap:8px;margin-top:4px}.macro{font-size:14px;display:flex;flex-direction:column;gap:4px}
.daynav{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}.daynav .btn{min-height:36px;padding:4px 12px;font-size:18px}

.x{border:0;background:transparent;color:var(--muted);font-size:15px;min-width:44px;min-height:44px;border-radius:10px;cursor:pointer;flex:none}
.x.sure{background:#c0463c;color:#fff;font-size:13px;padding:0 10px}
#fsheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto}
.fs-in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding:var(--top) max(16px,env(safe-area-inset-left,0px)) calc(24px + var(--bot))}
.fs-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fl{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);flex:1;min-width:0}
.gprev{padding:8px 0;font-size:15px}

@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.8}}
[hidden]{display:none!important}
.subbar{display:flex;align-items:center;margin-left:-6px}.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chips.scroll::-webkit-scrollbar{display:none}.chips.scroll .fchip{flex:none}
.fchip.off{opacity:.45}.timegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.timegrid .fchip{padding:8px 4px;text-align:center}

.pnav{justify-content:space-between}.pnav .btn{min-width:44px}
.pweek{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.pday{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:transparent;border-radius:12px;padding:6px 0;cursor:pointer;min-height:64px;color:inherit}
.pday small{color:var(--muted);font-size:11px;text-transform:uppercase}.pday b{font-size:15px}

i.done,.pgl.done{color:var(--ok)}i.missed,.pgl.missed{color:#c0463c}i.planned,.pgl.planned{color:var(--accent)}

.pdetail{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:10px}

.pmove{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--accent-soft);border-radius:12px;padding:8px 12px;font-size:14px}
.sw{width:50px;height:30px;border-radius:16px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none;padding:0}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}

.remrow{min-height:48px}
.hl{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px;font-size:14px}.cancelbox{width:100%;display:flex;flex-direction:column;gap:8px;padding:6px 0 10px}
.bigemoji{font-size:44px;line-height:1}.copy{display:flex;align-items:baseline;gap:8px;border:1px dashed var(--line);background:transparent;color:var(--fg);border-radius:10px;padding:6px 10px;margin:2px 0;font:600 17px var(--body);cursor:pointer;letter-spacing:.02em}.copy small{font-weight:400;color:var(--muted);font-size:12px;letter-spacing:0}

    if ((mut !== MUT || WRITES) && !retried) {

function searchDb(q) {
  var qw = nwords(q), out = []; if (!qw.length || !F.db) return [];
  F.db.forEach(function (it) {
    var score = 0, ok = qw.every(function (w) {
      var pre = w.slice(0, Math.min(w.length, 4)), whole = it.w.indexOf(w) !== -1, prefix = it.w.some(function (x) { return x.indexOf(pre) === 0; });

function chartSvg(points, w, h) {
  var ws = points.map(function (p) { return p.w; }), mn = Math.min.apply(null, ws), mx = Math.max.apply(null, ws), pad = 22;
  var rng = mx - mn || 1, W = w, H = h;
  var X = function (i) { return pad + (points.length === 1 ? (W - 2 * pad) / 2 : i * (W - 2 * pad) / (points.length - 1)); };
  var Y = function (v) { return H - pad - 10 - (v - mn) / rng * (H - 2 * pad - 20); };
  var d = points.map(function (p, i) { return (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.w).toFixed(1); }).join(" ");
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="График веса"><path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  points.forEach(function (p, i) { s += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p.w).toFixed(1) + '" r="4" fill="var(--accent)"/><text class="val" x="' + X(i).toFixed(1) + '" y="' + (Y(p.w) - 9).toFixed(1) + '" text-anchor="middle">' + fmt(p.w) + '</text><text x="' + X(i).toFixed(1) + '" y="' + (H - 4) + '" text-anchor="middle">' + esc(p.d) + '</text>'; });
  return s + '</svg>';
}

var PLAN = { off: 0, day: null, move: null, data: null };

  }).join("") + '</div>';

  if (d && !PLAN.move) {

    if (!d.items.length) o += '<div class="muted">' + (d.past ? 'В этот день ничего не было запланировано.' : 'Отдых. Можно поставить тренировку:') + '</div>';
    d.items.forEach(function (i) {
      o += '<div class="pit ' + i.st + '"><div class="row"><span><i class="pgl ' + i.st + '">' + planGlyph(i.st) + '</i> ' + esc(i.name) + '</span><span class="muted">' + (i.st === "done" ? 'сделано' : i.st === "missed" ? 'пропущено' : 'в плане') + '</span></div><div class="tools">';
      if (i.st === "done") o += '<button class="btn ghost" data-pa="undo" data-w="' + esc(i.w) + '" data-d="' + d.date + '">Снять отметку</button>';
      else {
        if (d.date <= todayKey()) o += '<button class="btn" data-pa="done" data-w="' + esc(i.w) + '" data-d="' + d.date + '">Сделала ✓</button>';
        o += '<button class="btn ghost" data-pa="move" data-w="' + esc(i.w) + '" data-d="' + d.date + '" data-n="' + esc(i.name) + '">Перенести</button><button class="btn ghost" data-pa="del" data-w="' + esc(i.w) + '" data-d="' + d.date + '">Убрать</button>';

function todayKey() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
function planLoad(force) {

view.addEventListener("click", function (e) {
  if (!document.getElementById("planbox")) return;
  var t = e.target.closest("#pprev,#pnext,#pmcancel,[data-pd],[data-pa]"); if (!t) return;
  if (t.id === "pprev" || t.id === "pnext") { PLAN.off += t.id === "pnext" ? 1 : -1; PLAN.off = Math.max(-8, Math.min(8, PLAN.off)); PLAN.day = null; PLAN.move = null; PLAN.data = cget(planKey()); if (PLAN.data) planRender(); planLoad(true); return; }
  if (t.id === "pmcancel") { PLAN.move = null; return planRender(); }
  if (t.dataset.pd) {
    var date = t.dataset.pd;
    if (PLAN.move) {
      if (date < todayKey()) return toast("Этот день уже прошёл");
      var m = PLAN.move; PLAN.move = null; PLAN.day = date; haptic();
      return planAct({ api: "plan_set", date: date, workoutId: m.w }, "Перенесла на " + date.slice(8) + "." + date.slice(5, 7));
    }
    PLAN.day = PLAN.day === date ? null : date; haptic(); return planRender();
  }
  var a = t.dataset.pa, w = t.dataset.w, d = t.dataset.d; haptic();
  if (a === "move") { PLAN.move = { w: w, name: t.dataset.n }; return planRender(); }
  if (a === "add") return planAct({ api: "plan_set", date: d, workoutId: w }, "Добавила в план");
  if (a === "del") return planAct({ api: "plan_remove", date: d, workoutId: w }, "Убрала из плана");
  if (a === "done") return planAct({ api: "plan_mark", date: d, workoutId: w, done: true }, "Отмечено ✓");
  if (a === "undo") return planAct({ api: "plan_mark", date: d, workoutId: w, done: false }, "Отметку сняла");
});

    (r.sub ? (r.sub.tier === "Сопровождение" ? "Сопровождение" : "Бот") + (r.sub.until ? " до " + esc(r.sub.until) : "") + (r.sub.active ? "" : " · истёк") : "Подписки нет") + '</div></div>';
  var act = r.sub && r.sub.active;
  o += '<section class="card"><div class="label">Доступ</div><div>' + (r.sub ? (r.sub.tier === "Сопровождение" ? "Сопровождение" : "Бот") + (r.sub.until ? " до <b>" + esc(r.sub.until) + "</b>" : "") + (act ? "" : " · истёк") : "Доступа нет") + '</div><div class="tools" style="margin-top:8px"><button class="btn" data-acc="open">' + (r.sub ? "Продлить" : "Открыть доступ") + '</button>' + (act ? '<button class="btn ghost" data-acc="close">Закрыть</button>' : '') + '</div></section>';
  // замеры
  o += '<section class="card"><div class="label">Замеры</div>';
  if (!r.checkins.length) o += '<div class="muted">Чек-инов пока нет</div>';
  else {
    var f = r.checkins[0], l = r.checkins[r.checkins.length - 1], v = function (x) { return x === "" || x == null ? "–" : fmt(x); };
    o += '<div class="tbl"><table><tr><th>дата</th><th>вес</th><th>рука</th><th>грудь</th><th>талия</th><th>бёдра</th><th>нога</th></tr>';
    r.checkins.slice(-8).forEach(function (c) { o += '<tr><td>' + c.d + '</td><td>' + v(c.weight) + '</td><td>' + v(c.arm) + '</td><td>' + v(c.chest) + '</td><td>' + v(c.waist) + '</td><td>' + v(c.hips) + '</td><td>' + v(c.thigh) + '</td></tr>'; });
    o += '</table></div>';
    if (r.checkins.length > 1) o += '<div class="muted">За период: вес ' + sgn(l.weight - f.weight) + ' кг · талия ' + sgn(l.waist - f.waist) + ' см · бёдра ' + sgn(l.hips - f.hips) + ' см</div>';
    if (r.withPhotos > 0) o += '<button class="btn" data-photos="' + esc(r.id) + '" style="align-self:flex-start">Показать фото в чате</button>';
  }
  o += '</section>';
  // тренировки
  if (r.notes && r.notes.length) o += '<section class="card"><div class="label">📝 Заметки к тренировкам</div>' + r.notes.map(function (n) { return '<div><b>' + esc(n.ex) + '</b> <span class="muted">' + esc(n.d) + '</span><div>' + esc(n.t) + '</div></div>'; }).join("") + '</section>';
  o += '<section class="card"><div class="label">Тренировки</div><div>За 7 дней: <b>' + r.w7 + '</b> · за 30 дней: <b>' + r.w30 + '</b></div>' +
    (r.plan && r.plan.some(function (x) { return x.total; }) ? '<div class="muted">План недели: ' + r.plan.filter(function (x) { return x.total; }).map(function (x) { return x.label + ' — ' + x.done + ' из ' + x.total; }).join(' · ') + '</div>' : '<div class="muted">План на неделю клиентка пока не составила</div>');
  r.workouts.forEach(function (w) { o += '<div class="row muted"><span>' + esc(w.name) + '</span><span>' + w.d + '</span></div>'; });
  if (!r.workouts.length) o += '<div class="muted">Завершённых тренировок нет</div>';
  if (r.programs.length) {
    o += '<div class="label" style="margin-top:6px">Назначенные программы</div>';
    r.programs.forEach(function (p) { o += '<div class="row"><span>' + esc(p.name) + ' <span class="muted">· ' + p.n + ' упр.</span></span><span style="display:flex;gap:6px"><button class="btn" data-wedit="' + esc(p.id) + '">Править</button><button class="btn ghost" data-copy="' + esc(p.id) + '" data-pname="' + esc(p.name) + '">Копировать</button><button class="btn ghost" data-tpl="' + esc(p.id) + '" title="Сохранить как шаблон">📌</button></span></div>'; });
  }
  o += '<button class="btn" data-assign="' + esc(r.id) + '" style="align-self:flex-start">＋ Назначить тренировку</button></section>';
  if (r.best.length) { o += '<section class="card"><div class="label">Рабочие веса</div>'; r.best.forEach(function (b) { o += '<div class="row"><span>' + esc(b.name) + '</span><span><b>' + fmt(b.best) + ' кг</b>' + (b.n > 1 && b.best > b.first ? ' <span class="chip">' + sgn(b.best - b.first) + '</span>' : '') + '</span></div>'; }); o += '</section>'; }
  o += '<section class="card"><div class="label">Питание</div><div>Сегодня: <b>' + num(r.nutrition.today) + '</b>' + (r.nutrition.goal ? ' из ' + num(r.nutrition.goal) : '') + ' ккал</div>' +
    '<div class="muted">' + (r.nutrition.avg7 !== null ? 'В среднем за 7 дней: ' + num(r.nutrition.avg7) + ' ккал (' + r.nutrition.days7 + ' ' + plural(r.nutrition.days7, "день", "дня", "дней") + ' с записями)' : 'За неделю записей нет') + '</div>' +
    '<button class="btn" data-cmd-client="' + esc(r.id) + '" style="align-self:flex-start">Дневник по дням в чате</button></section>';
  if (r.profile.length) { o += '<section class="card"><details><summary class="label" style="cursor:pointer">Анкета</summary><div style="margin-top:10px;display:flex;flex-direction:column;gap:8px">'; r.profile.forEach(function (p) { o += '<div><div class="muted">' + esc(p[0]) + '</div>' + esc(p[1]) + '</div>'; }); o += '</div></details></section>'; }
  o += '<section class="card"><div class="label">Карта нагрузки</div><div class="muted">Какие мышцы клиентка реально нагружала за период.</div><button class="btn" id="bmopen" style="align-self:flex-start">Открыть карту</button></section>';
  var ncm = r.nc || {}, mood = ncm.mood || {}, mk = Object.keys(mood);
  o += '<section class="card"><div class="label">Режим «без счёта»</div><div class="muted">Для клиенток, которым цифры вредят. Ты видишь всё как обычно, она — нет.</div>' +
    '<label class="row" style="gap:10px;justify-content:flex-start"><input type="checkbox" id="ncf"' + (ncm.food ? ' checked' : '') + '><span>Скрыть калории, КБЖУ и граммы</span></label>' +
    '<label class="row" style="gap:10px;justify-content:flex-start"><input type="checkbox" id="ncw"' + (ncm.weigh ? ' checked' : '') + '><span>Не просить вес и замеры</span></label>' +
    (mk.length ? '<div class="muted">Самочувствие после еды за 2 недели: ' + mk.map(function (k) { return esc(k) + ' — ' + mood[k]; }).join(' · ') + '</div>' : '') +
    '<button class="btn" id="ncsave" style="align-self:flex-start">Сохранить режим</button></section>';
  o += '<section class="card"><div class="label">Заметка</div><textarea id="note" rows="3" placeholder="Видна только тебе">' + esc(r.note) + '</textarea><button class="btn" id="notesave" style="align-self:flex-start">Сохранить заметку</button></section>';
  view.innerHTML = o;
  document.getElementById("cback").onclick = function () { setTab(S.tab); };
  document.getElementById("bmopen").onclick = function () { openTrainerBodyMap(r.id, r.name); };
  document.getElementById("ncsave").onclick = function () { var b = this; b.disabled = true; api({ api: "t_nc_set", id: r.id, food: document.getElementById("ncf").checked, weigh: document.getElementById("ncw").checked }).then(function (x) { b.disabled = false; toast(x && x.ok ? "Режим сохранён" : "Не получилось"); if (x && x.ok) cset("tcl_" + r.id, null); }); };
  document.getElementById("notesave").onclick = function () { var b = this; b.disabled = true; api({ api: "t_note", id: r.id, text: document.getElementById("note").value }).then(function (x) { b.disabled = false; toast(x && x.ok ? "Заметка сохранена" : "Не получилось"); if (x && x.ok) cset("tcl_" + r.id, null); }); };
}
view.addEventListener("click", function (e) {
  var p = e.target.closest("[data-photos]");
  if (p) { toast("Присылаю фото в чат…"); api({ api: "t_photos", id: p.dataset.photos }).then(function (x) { if (x && x.ok) { try { tg && tg.close(); } catch (er) {} } else toast("Не получилось"); }); return; }
  var ac = e.target.closest("[data-acc]");
  if (ac && S.tcard) return ac.dataset.acc === "open" ? openAccessSheet(S.tcard) : closeAccess(S.tcard);
  var tp = e.target.closest("[data-tpl]");
  if (tp) { tp.disabled = true; return api({ api: "t_tpl_save", workoutId: tp.dataset.tpl }).then(function (x) { tp.disabled = false; toast(x && x.ok ? "Сохранено в шаблоны" : (x && x.error === "limit" ? "Шаблонов уже 60" : "Не получилось")); }); }
  var we = e.target.closest("[data-wedit]");
  if (we) return openWorkoutEditor(we.dataset.wedit);
  var c = e.target.closest("[data-copy]");
  if (c) return openCopySheet(c.dataset.copy, c.dataset.pname);
  var as = e.target.closest("[data-assign]");
  if (as) return openAssignSheet(as.dataset.assign);
  var d = e.target.closest("[data-cmd-client]");
  if (d) { goBot("/clientfood"); }
});

function openWorkoutEditor(wid) {
  var old = document.getElementById("sheet"); if (old) old.remove();
  var el = document.createElement("div"); el.id = "sheet";
  el.innerHTML = '<div class="sheet-bg"></div><div class="sheet-in" style="max-height:92vh;overflow:auto"><div class="row"><b>Редактор тренировки</b><button class="btn ghost" id="sclose">Закрыть</button></div><style>#sheet input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);box-sizing:border-box}#sheet input::placeholder{color:var(--muted);opacity:.7}#sheet label.lb{display:block;font-size:12px;color:var(--muted);margin:2px 0 4px}</style><div id="wbody" class="muted" style="margin-top:10px">Загружаю…</div></div>';
  document.body.appendChild(el);
  var W = null, dirty = false, pick = null;
  var close = function () { if (dirty && !confirm("Закрыть без сохранения?")) return; el.remove(); };
  el.querySelector(".sheet-bg").onclick = close; document.getElementById("sclose").onclick = close;
  var body = document.getElementById("wbody");
  function draw() {
    var o = '<label class="lb">Название тренировки</label><input id="wname" value="' + esc(W.name) + '" maxlength="80" style="width:100%;margin-bottom:10px" placeholder="Название">';
    W.items.forEach(function (it, i) {
      o += '<div class="card" style="margin:0 0 8px;padding:10px"><div class="row"><b>' + (i + 1) + '. ' + esc(it.name) + (it.n ? '' : ' <span class="chip">своё</span>') + '</b></div>' +
        '<div style="display:flex;gap:6px;margin-top:8px"><label class="lb" style="width:48px;text-align:center;margin:0">Подх.</label><span style="width:10px"></span><label class="lb" style="margin:0">Повторения</label></div><div style="display:flex;gap:6px;align-items:center;margin-top:4px"><input data-s="' + i + '" value="' + esc(it.sets) + '" inputmode="numeric" style="width:48px;text-align:center"> <span>×</span> <input data-r="' + i + '" value="' + esc(it.reps) + '" maxlength="20" style="flex:1;min-width:0" placeholder="10-12 на ногу"></div>' +
        '<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><button class="btn ghost" data-up="' + i + '"' + (i ? '' : ' disabled') + '>↑</button><button class="btn ghost" data-dn="' + i + '"' + (i < W.items.length - 1 ? '' : ' disabled') + '>↓</button><button class="btn ghost" data-rep="' + i + '">Заменить</button><button class="btn ghost" data-del="' + i + '">Удалить</button></div></div>';
    });
    o += '<button class="btn" id="wadd" style="margin:4px 0 10px">＋ Добавить упражнение</button><button class="btn primary" id="wsave" style="width:100%">Сохранить</button><button class="btn ghost" id="wdelall" style="width:100%;margin-top:8px">Удалить тренировку</button>';
    body.className = ""; body.innerHTML = o;
  }
  function sync() { var n = document.getElementById("wname"); if (n) W.name = n.value; body.querySelectorAll("[data-s]").forEach(function (x) { W.items[+x.dataset.s].sets = x.value; }); body.querySelectorAll("[data-r]").forEach(function (x) { W.items[+x.dataset.r].reps = x.value; }); }
  function chooser(replaceIdx) {
    sync();
    var run = function () {
      var list = S.cat || [];
      body.innerHTML = '<input id="wq" placeholder="Название упражнения" style="width:100%"><div id="wres" style="margin-top:8px"></div><button class="btn ghost" id="wcancel" style="margin-top:8px">Назад</button>';
      var q = document.getElementById("wq"), res = document.getElementById("wres");
      function show() {
        var v = q.value.trim().toLowerCase(), m = list.filter(function (x) { return !v || x.name.toLowerCase().indexOf(v) >= 0; }).slice(0, 30), h = "";
        m.forEach(function (x) { h += '<button class="btn ghost" data-pick="' + x.n + '" style="display:block;width:100%;text-align:left;margin-bottom:4px">' + esc(x.name) + ' <span class="muted">' + esc(x.cat || "") + '</span></button>'; });
        if (v) h += '<button class="btn" data-own="1" style="display:block;width:100%;margin-top:6px">✍️ Своё: ' + esc(q.value.trim()) + '</button>';
        res.innerHTML = h;
      }
      q.oninput = show; show();
      res.onclick = function (e) {
        var p = e.target.closest("[data-pick]"), ow = e.target.closest("[data-own]"), it = null;
        if (p) { var f = list.filter(function (x) { return String(x.n) === p.dataset.pick; })[0]; it = { n: f.n, name: f.name }; }
        else if (ow) it = { n: 0, name: q.value.trim().slice(0, 100) };
        if (!it) return;
        if (replaceIdx !== null) { W.items[replaceIdx].n = it.n; W.items[replaceIdx].name = it.name; }
        else W.items.push({ n: it.n, name: it.name, sets: "3", reps: "10" });
        dirty = true; draw();
      };
      document.getElementById("wcancel").onclick = draw;
    };
    if (S.cat) run(); else { api({ api: "t_catalog" }).then(function (r) { S.cat = (r && r.items) || []; run(); }); }
  }
  body.onclick = function (e) {
    var t = e.target.closest("button"); if (!t) return;
    if (t.id === "wadd") return chooser(null);
    if (t.dataset.rep !== undefined) return chooser(+t.dataset.rep);
    if (t.dataset.up !== undefined) { sync(); var i = +t.dataset.up; W.items.splice(i - 1, 0, W.items.splice(i, 1)[0]); dirty = true; return draw(); }
    if (t.dataset.dn !== undefined) { sync(); var j = +t.dataset.dn; W.items.splice(j + 1, 0, W.items.splice(j, 1)[0]); dirty = true; return draw(); }
    if (t.dataset.del !== undefined) { sync(); if (W.items.length < 2) return toast("Нельзя оставить пустую тренировку"); W.items.splice(+t.dataset.del, 1); dirty = true; return draw(); }
    if (t.id === "wsave") {
      sync();
      for (var k = 0; k < W.items.length; k++) { var it = W.items[k]; if (!/^\d{1,2}$/.test(String(it.sets).trim()) || +it.sets < 1 || +it.sets > 20) return toast("Подходы в «" + it.name + "»: число от 1 до 20"); if (!String(it.reps).trim()) return toast("Укажи повторения в «" + it.name + "»"); }
      if (!W.name.trim()) return toast("Укажи название");
      t.disabled = true; t.textContent = "Сохраняю…";
      api({ api: "t_wsave", id: wid, name: W.name, items: W.items }).then(function (r) {
        if (r && r.ok) { haptic("ok"); dirty = false; cset("tcl_" + W.clientId, null); el.remove(); toast("Сохранено"); openCard(W.clientId); }
        else { t.disabled = false; t.textContent = "Сохранить"; toast("Не получилось сохранить"); }
      });
      return;
    }
    if (t.id === "wdelall") {
      if (t.dataset.sure !== "1") { t.dataset.sure = "1"; t.textContent = "Точно удалить? Нажми ещё раз"; return; }
      api({ api: "t_wdel", id: wid }).then(function (r) { if (r && r.ok) { dirty = false; cset("tcl_" + W.clientId, null); el.remove(); toast("Удалено"); openCard(W.clientId); } else toast("Не получилось"); });
    }
  };
  api({ api: "t_wget", id: wid }).then(function (r) { if (!r || !r.ok) { body.textContent = "Не получилось загрузить"; return; } W = r; draw(); });
}

function openAccessSheet(cid) {
  var tier = "Бот", days = 30;
  var cl = (S.clients || []).filter(function (c) { return c.id === cid; })[0];
  openSheet("Доступ клиентки", '<div id="accb"></div>', function (el, close) {
    var box = document.getElementById("accb");
    function draw() {
      box.innerHTML = '<div class="muted">Дни прибавляются к дате окончания, если доступ ещё действует. Если уже закончился, считаются с сегодняшнего дня. Смена тарифа считается с сегодняшнего дня.</div>' +
        '<div class="chips" style="margin:12px 0"><button class="btn ' + (tier === "Бот" ? 'on' : '') + '" data-tr="Бот">Бот</button><button class="btn ' + (tier === "Сопровождение" ? 'on' : '') + '" data-tr="Сопровождение">Сопровождение</button></div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' + [7, 14, 30, 60, 90].map(function (d) { return '<button class="btn ' + (days === d ? 'on' : '') + '" data-d="' + d + '">' + d + ' дн.</button>'; }).join("") + '</div>' +
        '<button class="btn primary" id="accok" style="width:100%;margin-top:14px">Подтвердить: ' + tier + ' +' + days + ' дн.</button><div class="muted" style="margin-top:8px">Клиентке придёт сообщение о продлении.</div>';
      box.querySelectorAll("[data-tr]").forEach(function (b) { b.onclick = function () { tier = b.dataset.tr; draw(); }; });
      box.querySelectorAll("[data-d]").forEach(function (b) { b.onclick = function () { days = +b.dataset.d; draw(); }; });
      document.getElementById("accok").onclick = function () {
        var b = this; b.disabled = true; b.textContent = "Сохраняю…";
        api({ api: "t_access_set", id: cid, tier: tier, days: days }).then(function (r) {
          if (r && r.ok) { haptic("ok"); cset("tcl_" + cid, null); close(); toast("Доступ до " + r.until); openCard(cid); } else { b.disabled = false; toast("Не получилось"); draw(); }
        });
      };
    }
    draw();
  });
}
function closeAccess(cid) {
  openSheet("Закрыть доступ?", '<div class="muted">Клиентка сразу потеряет доступ к приложению и платным функциям бота. Ей придёт сообщение.</div><button class="btn primary" id="accc" style="width:100%;margin-top:14px">Да, закрыть доступ</button>', function (el, close) {
    document.getElementById("accc").onclick = function () {
      var b = this; b.disabled = true;
      api({ api: "t_access_revoke", id: cid }).then(function (r) { if (r && r.ok) { cset("tcl_" + cid, null); close(); toast("Доступ закрыт"); openCard(cid); } else { b.disabled = false; toast("Не получилось"); } });
    };
  });
}

function openSlots() {
  var el = openSheet("Окна для записи", '<div id="slb" class="muted">Загружаю…</div>', null);
  var box = document.getElementById("slb"), items = [], sel = {}, date = "";
  var HOURS = []; for (var h = 7; h <= 21; h++) HOURS.push((h < 10 ? "0" : "") + h + ":00");
  function ruDate(iso) { var p = iso.split("-"); return p[2] + "." + p[1] + "." + p[0]; }
  function load() { api({ api: "t_slots" }).then(function (r) { items = (r && r.ok) ? r.items : []; draw(); }); }
  function draw() {
    box.className = "";
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var minIso = today.getFullYear() + "-" + ("0" + (today.getMonth() + 1)).slice(-2) + "-" + ("0" + today.getDate()).slice(-2);
    var o = '<div class="label">Добавить окна</div><input type="date" id="sld" min="' + minIso + '" value="' + date + '" style="width:100%;margin:6px 0 8px">';
    if (date) {
      var taken = {}; items.forEach(function (x) { if (x.d === ruDate(date)) taken[x.t] = 1; });
      o += '<div style="display:flex;flex-wrap:wrap;gap:6px">' + HOURS.map(function (t) { return '<button class="btn ' + (sel[t] ? 'on' : '') + '"' + (taken[t] ? ' disabled style="opacity:.4"' : '') + ' data-h="' + t + '">' + t + '</button>'; }).join("") + '</div>' +
        '<div style="display:flex;gap:6px;margin-top:8px"><input type="time" id="slt" style="flex:1"><button class="btn" id="slta">＋ своё время</button></div>';
      var n = Object.keys(sel).length;
      o += '<button class="btn primary" id="slok" style="width:100%;margin-top:12px"' + (n ? '' : ' disabled') + '>Добавить' + (n ? ' (' + n + ')' : '') + '</button>';
    } else o += '<div class="muted">Выбери дату, потом время (можно несколько).</div>';
    o += '<div class="label" style="margin-top:18px">Уже в расписании</div>';
    if (!items.length) o += '<div class="muted">Пока ничего нет</div>';
    var cur = "";
    items.forEach(function (x) {
      if (x.d !== cur) { cur = x.d; o += '<div class="muted" style="margin-top:8px">' + esc(x.d) + '</div>'; }
      o += '<div class="row"><span>' + esc(x.t) + ' <span class="muted">' + (x.s === "free" ? 'свободно' : x.s === "wait" ? 'ждёт подтверждения' : 'занято') + '</span></span>' + (x.s === "free" ? '<button class="btn ghost" data-del="' + esc(x.d) + '|' + esc(x.t) + '">Убрать</button>' : '') + '</div>';
    });
    box.innerHTML = o;
    var d = document.getElementById("sld"); if (d) d.onchange = function () { date = d.value; sel = {}; draw(); };
    box.querySelectorAll("[data-h]").forEach(function (b) { b.onclick = function () { if (sel[b.dataset.h]) delete sel[b.dataset.h]; else sel[b.dataset.h] = 1; draw(); }; });
    var ta = document.getElementById("slta"); if (ta) ta.onclick = function () { var v = document.getElementById("slt").value; if (v) { sel[v] = 1; draw(); } };

  return new Promise(function (res) { setTimeout(function () { var r = JSON.parse(JSON.stringify(D[req.api] || { ok: false })); if (req.api === "home") { if (false) { r.access = false; r.store = { trainer: "valeryiankaa", items: [{ g: "Приложение", i: "🤖", n: "Подписка на бот", p: "500 ₽", per: "в месяц", d: "Тренировки, питание по фото, прогресс и напоминания." }, { g: "Ведение", i: "🤝", n: "Сопровождение", p: "7 000 ₽", per: "в месяц", hit: true, d: "Программа, питание, обратная связь, закрытый канал." }, { g: "Разовые услуги", i: "📋", n: "Программа (зал или дома)", p: "2 000 ₽", d: "Индивидуальная программа под твою цель." }] }; } if (/[?&]trainer=1/.test(location.search)) r.trainer = true; if (D_PLAN) r.plan = D_PLAN; } if (req.api === "water" && S.home && S.home.water) { S.home.water.now++; r.water = S.home.water; if (S.home.pet) r.pet = S.home.pet; } res(r); }, 250); });
}

/* ---------- запуск ---------- */
setupTelegram();
// Пока человек смотрит «Сегодня», тихо подгружаем остальные вкладки по очереди (не сразу все: сервер отвечает медленнее при параллельных запросах)
/* ---------- кнопка «Назад» в шапке Телеграма: возвращает на предыдущий экран внутри приложения ---------- */
function backAction() {
  var sh = document.getElementById("sheet"), fs = document.getElementById("fsheet");
  if (sh) { var c = document.getElementById("sclose") || sh.querySelector(".sheet-bg"); if (c) c.click(); return; }
  if (fs) { var f = document.getElementById("fback") || document.getElementById("fclose"); if (f) f.click(); else closeFoodSheet(); return; }
  var b = document.getElementById("sback") || document.getElementById("back") || document.getElementById("cback") || document.getElementById("eback");
  if (b) { b.click(); return; }
  if (S.sub || S.tcard) { S.tcard = null; backTo(S.tab); }
}
function syncBack() {
  if (!tg || !tg.BackButton) return;
  var deep = document.getElementById("sheet") || document.getElementById("fsheet") || S.sub || S.tcard || document.getElementById("back");
  try { if (deep) tg.BackButton.show(); else tg.BackButton.hide(); } catch (e) {}
}
(function () {
  var t = null, kick = function () { clearTimeout(t); t = setTimeout(syncBack, 60); };
  try { if (tg && tg.BackButton) tg.BackButton.onClick(backAction); } catch (e) {}
  try { new MutationObserver(kick).observe(document.body, { childList: true }); new MutationObserver(kick).observe(view, { childList: true }); } catch (e) {}
})();

function prefetchTabs() {
  if (S.prefetched || !S.home || !S.home.access || (S.trainer && !S.clientView)) return; S.prefetched = true;
  var jobs = [["workouts", { api: "workouts" }], ["food_0", { api: "food_day", offset: 0 }], ["progress", { api: "progress" }], ["records", { api: "records" }], ["exlist", { api: "ex_list" }]], i = 0;
  var next = function () { if (i >= jobs.length) { loadFoodDb(); return; } var j = jobs[i++]; if (cget(j[0])) return setTimeout(next, 300); api(j[1], true).then(function (r) { if (r && r.ok && !WRITES) cset(j[0], r); setTimeout(next, 1200); }); };
  setTimeout(next, 2500);
}
function startApp() {
  try { S.clientView = !!localStorage.getItem("cv_" + UID); } catch (e) {}
  renderTabs(); S.home = null;
  var q = /[?&]w=([^&]+)/.exec(location.search);
  var gm = /[?&]go=([a-z]+)/.exec(location.search), go = gm ? gm[1] : "";
  if (go === "foodday" && !q) { S.clientView = true; renderTabs(); setTab("food"); }
  else if (go && !q && go !== "food" && go !== "x") { S.clientView = true; renderTabs(); S.trainSeg = go === "ex" ? "ex" : go === "hist" ? "hist" : "mine"; S.progSeg = go === "rec" ? "rec" : "body"; var tabOf = { train: "train", ex: "train", hist: "train", progress: "records", rec: "records", more: "more" }[go]; if (tabOf) setTab(tabOf); else if (go === "book" || go === "pay" || go === "onboard" || go === "checkin" || go === "plan" || go === "summary" || go === "rem" || go === "photo" || go === "mat") { setTab("today"); goApp(go); } else setTab("today"); }
  else if (go === "food" && !q) { S.clientView = true; renderTabs(); F.pending = true; setTab("food"); }
  else if (q) { S.clientView = true; renderTabs(); setTab("train"); openRun(decodeURIComponent(q[1])); }
  else setTab(S.trainer && !S.clientView ? "tpanel" : "today");
  document.addEventListener("visibilitychange", function () { if (!document.hidden && S.tab === "today" && S.home && !S.run) { S.home = null; showToday(); } });
}
if (!DEMO && !(tg && tg.initData) && !KB) {
  document.getElementById("tabs").style.display = "none";
  view.innerHTML = '<div class="center"><h2>Valeryiankaa</h2><div class="muted">Это приложение открывается из Телеграма: зайди в чат с ботом и нажми кнопку «Приложение».</div></div>';
} else {
  var cached = cget("home");
  if (cached) { S.home = cached; S.trainer = !!cached.trainer; startApp(); }
  else {
    skeleton();
    api({ api: "home" }).then(function (r) {
      if (!r || !r.ok) return errorScreen(r && r.error, function () { location.reload(); }, r && r.why);
      S.home = r; S.trainer = !!r.trainer; cset("home", r); startApp();
    });
  }
}
